<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        function isExtensionError(text) {
          if (!text) return false;
          var s = String(text).toLowerCase();
          return (
            s.indexOf('metamask') !== -1 ||
            s.indexOf('ethereum') !== -1 ||
            s.indexOf('web3') !== -1 ||
            s.indexOf('failed to connect') !== -1 ||
            s.indexOf('inpage') !== -1 ||
            s.indexOf('contentscript') !== -1 ||
            s.indexOf('extension') !== -1
          );
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var msg = (arg && (arg.message || arg.stack)) ? (arg.message + ' ' + arg.stack) : String(arg);
            if (isExtensionError(msg)) {
              return;
            }
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var msg = (arg && (arg.message || arg.stack)) ? (arg.message + ' ' + arg.stack) : String(arg);
            if (isExtensionError(msg)) {
              return;
            }
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack)) ? (reason.message + ' ' + reason.stack) : String(reason);
          if (isExtensionError(msg)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || '');
          var src = event && (event.filename || '');
          if (isExtensionError(msg) || isExtensionError(src)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
